<!doctype html>
<!-- Open Graph card (1200x630), rendered to public/og.jpg by scripts/og.mjs. Uses only Yoav's own photo. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { background: radial-gradient(ellipse at 70% 45%, #262626 0%, #0a0a0a 55%, #000 85%); color: #fff;
         font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; position: relative; }
  img { position: absolute; right: 40px; bottom: -10px; width: 560px; height: 560px; object-fit: contain; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / .04) 1px, transparent 1px),
          linear-gradient(90deg, rgb(255 255 255 / .04) 1px, transparent 1px); background-size: 48px 48px; }
  .text { position: absolute; left: 72px; top: 90px; }
  .label { font: 400 15px ui-monospace, Menlo, monospace; letter-spacing: .2em; text-transform: uppercase; color: #9ca3af; }
  h1 { margin: 26px 0 0; font-weight: 900; font-size: 148px; line-height: .86; letter-spacing: -.05em; text-transform: uppercase;
       background: linear-gradient(180deg, #fff 8%, #d1d5db 52%, #1f2937 118%); -webkit-background-clip: text; color: transparent; }
  .role { margin-top: 34px; font-size: 38px; letter-spacing: -.02em; }
  .role em { font-family: 'Iowan Old Style', Palatino, Georgia, serif; font-weight: 300; color: #e8e4dc; }
  .foot { position: absolute; left: 72px; bottom: 64px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <img src="../public/assets/yoav.webp" alt="" />
  <div class="text">
    <p class="label">Portfolio · Reichman University</p>
    <h1>Yoav<br />Dory</h1>
    <p class="role"><strong>Student Developer</strong> <em>&amp; Product Builder</em></p>
  </div>
  <p class="label foot">PermissionGuard · glassbox · EastWire</p>
</body>
</html>
